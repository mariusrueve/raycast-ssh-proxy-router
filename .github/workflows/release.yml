name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION)) throw new Error("Use a version such as v0.1.0")'
      - run: npm ci
      - run: npm run check
      - name: Build release artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          npm run bundle
          git archive --format=tar.gz --prefix=ssh-proxy-router/ --output=release/ssh-proxy-router-source.tar.gz HEAD
          node scripts/release-notes.mjs > release/RELEASE_NOTES.md
          cd release
          shasum -a 256 ssh-proxy-router.rayext ssh-proxy-router-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 14
          if-no-files-found: error

  draft:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_VERSION" --draft --target "$RELEASE_SHA" \
            --title "SSH Proxy Router $RELEASE_VERSION" --notes-file release/RELEASE_NOTES.md \
            release/ssh-proxy-router.rayext release/ssh-proxy-router-source.tar.gz release/SHA256SUMS
